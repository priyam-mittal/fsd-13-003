<div class="hero"><h1>Student Feedback</h1><p>Your feedback helps us improve our classes.</p></div>
<main class="container">
<div class="card">
<h2>Share Your Feedback</h2>
<form onsubmit="event.preventDefault(); alert('Thank you for your feedback!');">
<label>Name</label><input type="text" placeholder="Enter your name" required>
<label>Email</label><input type="email" placeholder="Enter your email">
<label>Course</label><select required><option value="">Select course</option><option>Mathematics</option><option>Science</option><option>English</option><option>Computer Science</option><option>All Subjects</option></select>
<label>Rating</label><select required><option value="">Choose rating</option><option>5 - Excellent</option><option>4 - Very Good</option><option>3 - Good</option><option>2 - Needs Improvement</option><option>1 - Poor</option></select>
<label>Your Feedback</label><textarea placeholder="Write your feedback here..." required></textarea>
<button type="submit">Submit Feedback</button>
</form>
</div>
</main>
