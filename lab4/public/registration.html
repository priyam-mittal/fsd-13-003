<div class="hero"><h1>Student Registration</h1><p>Join our tuition classes and start learning today.</p></div>
<main class="container">
<div class="card">
<h2>Registration Form</h2>
<form onsubmit="event.preventDefault(); alert('Registration submitted successfully!');">
<label>Full Name</label><input type="text" placeholder="Enter your full name" required>
<label>Email</label><input type="email" placeholder="Enter your email" required>
<label>Mobile Number</label><input type="tel" placeholder="Enter mobile number" required>
<label>Class / Grade</label><select required><option value="">Select class</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select>
<label>Choose Course</label><select required><option value="">Select course</option><option>Mathematics</option><option>Science</option><option>English</option><option>Computer Science</option><option>All Subjects</option></select>
<label>Password</label><input type="password" placeholder="Create a password" required>
<button type="submit">Register Now</button>
</form>
</div>
</main>
